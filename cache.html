<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO JAILBREAK PS4 - KENNY YOON</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
        background-color: #0b0e14;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
    }
    .container {
        width: 100%;
        max-width: 580px;
        background: #121824;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 30px 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
    }
    .title {
        color: #0084ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        text-transform: uppercase;
    }
    .subtitle {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 24px;
    }
    .status-card {
        background: #172030;
        border: 1px solid #232f45;
        border-radius: 8px;
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .info {
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
        letter-spacing: 0.5px;
    }
    .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #1e293b;
        border-top-color: #0084ff;
        border-radius: 50%;
        animation: spin 1s infinite linear;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    var msgs = document.getElementById("msgs");
    if (msgs) {
        msgs.innerHTML = "Đang lưu Bộ nhớ đệm (Cache) ... " + pct + "%";
    }
}

function DisplayCacheProgress() {
    var msgs = document.getElementById("msgs");
    if (msgs) {
        msgs.style.color = "#22c55e";
        msgs.innerHTML = "Lưu Cache thành công! Đang chuyển hướng...";
    }
    setTimeout(function () {
        location.reload();
    }, 2000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>
    <div class="container">
        <div class="title">AUTO JAILBREAK PS4 - KENNY YOON</div>
        <div class="subtitle">CẤU HÌNH BỘ NHỚ TẠM OFFLINE</div>

        <div class="status-card">
            <div class="loader"></div>
            <div id="msgs" class="info">Đang chuẩn bị lưu Cache...</div>
        </div>
    </div>
</body>
</html>
