<!doctype html>
<html lang="vi" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AUTO JAILBREAK PS4 - KENNY YOON</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: #0b0e14;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 580px;
        background: #121824;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .title {
        color: #0084ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .subtitle {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 24px;
      }

      /* Khung hiển thị trạng thái chính */
      .status-card {
        background: #172030;
        border: 1px solid #232f45;
        border-radius: 8px;
        padding: 30px 20px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      /* Vòng xoay nạp exploit nhẹ cho PS4 */
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid #1e293b;
        border-top-color: #0084ff;
        border-radius: 50%;
        animation: spin 1s infinite linear;
      }

      .status-text {
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
        letter-spacing: 0.5px;
      }

      /* Cập nhật màu sắc theo trạng thái chạy */
      body.done .loader {
        display: none;
      }
      body.done .status-card {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.05);
      }
      body.done .status-text {
        color: #22c55e;
      }

      body.fail .loader {
        display: none;
      }
      body.fail .status-card {
        border-color: rgba(239, 68, 68, 0.4);
        background: rgba(239, 68, 68, 0.05);
      }
      body.fail .status-text {
        color: #ef4444;
      }

      #msg {
        display: none;
        font-size: 13px;
        font-weight: 700;
        color: #ef4444;
        text-transform: uppercase;
        margin-top: 8px;
      }
      body.fail #msg {
        display: block;
      }

      /* Đảm bảo phần Log vẫn hiển thị tốt nếu hệ thống kích hoạt chế độ Debug Log */
      #wrap { padding: 0; text-align: left; }
      #state, #out { display: none; }
      body.log body {
        overflow: auto;
        display: block;
      }
      body.log .container {
        max-width: 90%;
        margin: 0 auto;
      }
      body.log #state {
        display: block;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #38bdf8;
        font-family: monospace;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 monospace;
        background: #0b0e14;
        border: 1px solid #232f45;
        border-radius: 8px;
        padding: 16px;
        max-height: 70vh;
        overflow-y: auto;
        color: #94a3b8;
      }

      .ok { color: #22c55e; }
      .bad { color: #ef4444; }
      .warn { color: #eab308; }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>

    <div class="container" id="main-container">
      <div class="title">AUTO JAILBREAK PS4 - KENNY YOON</div>
      <div class="subtitle">ĐANG KÍCH HOẠT HỆ THỐNG</div>

      <div class="status-card">
        <div class="loader" id="spin"></div>
        <div class="status-text" id="status-title">Đang khởi chạy Jailbreak...</div>
      </div>

      <div id="msg">Khởi động lại máy PS4 và thử lại</div>

      <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
      </div>
    </div>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
