            gap: 10px;

    <script>
        if (window.applicationCache && window.applicationCache.status == 0) {
            window.location.replace("cache.html");
        }

<body>

    <div class="container">
        <div class="title">AUTO JAILBREAK PS4 - KENNY YOON</div>
        <div class="subtitle">HỖ TRỢ FW 11.00 - 13.52</div>

        <div class="row">
            <span class="label">FIRMWARE</span>
            <span class="value" id="fw-info">Đang kiểm tra...</span>
        </div>

        <div class="row">
            <span class="label">TẢI TRỌNG</span>
            <span class="value" style="color: #ffffff;">GoldHEN v2.4b18.12</span>
        </div>

        <div class="row">
            <span class="label">NGÀY CẬP NHẬT</span>
            <span class="value" style="color: #ffffff;">22/09/2026</span>
        </div>

        <div class="row">
            <span class="label">BỘ NHỚ TẠM (CACHE)</span>
            <span class="value" id="cache-info">Chờ xử lý...</span>
        </div>

        <div class="row">
            <span class="label">TRẠNG THÁI</span>
            <span class="value" id="status-info">Khởi tạo...</span>
        </div>

        <!-- Thẻ chứa ẩn để hệ thống JS gốc ghi log mà không phá vỡ giao diện -->
        <div id="console" style="display: none;"></div>
    </div>

    <script>
        (function () {
            var con = document.getElementById("console");
            var fwInfo = document.getElementById("fw-info");
            var cacheInfo = document.getElementById("cache-info");
            var statusInfo = document.getElementById("status-info");

            // Hàm cập nhật giao diện Việt hóa thay cho việc in chuỗi thuần
            function print(msg, cls) {
                // Vẫn tạo thẻ span vào console gốc để tránh lỗi script nếu có bên thứ 3 truy cập
                var span = document.createElement("span");
                if (cls) span.className = cls;
                span.textContent = msg + "\n";
                con.appendChild(span);

                // Cập nhật lên UI mới
                var lowerMsg = msg.toLowerCase();

                if (msg.indexOf("firmware:") !== -1) {
                    var fwVal = msg.replace("firmware:", "").trim();
                    if (fwVal === "unknown") fwVal = "không xác định";
                    fwInfo.textContent = fwVal;
                }
                else if (msg.indexOf("supported:") !== -1) {
                    if (msg.indexOf("yes") !== -1) {
                        fwInfo.innerHTML = (fwInfo.textContent) + ' · <span class="ok">Được hỗ trợ</span>';
                    } else {
                        fwInfo.innerHTML = (fwInfo.textContent) + ' · <span class="bad">Không hỗ trợ</span>';
                    }
                }
                else if (lowerMsg.indexOf("caching") !== -1 || lowerMsg.indexOf("cached") !== -1 || lowerMsg.indexOf("cache") !== -1) {
                    var txt = msg;
                    if (lowerMsg.indexOf("offline — running from cache") !== -1) txt = "Đã lưu Cache (Chạy Offline)";
                    else if (lowerMsg.indexOf("cached for offline use") !== -1) txt = "Đã lưu Cache thành công";
                    else if (lowerMsg.indexOf("cached — offline ready") !== -1) txt = "Sẵn sàng chạy Offline";
                    else if (lowerMsg.indexOf("checking cache") !== -1) txt = "Đang kiểm tra Cache...";
                    else if (lowerMsg.indexOf("caching for offline") !== -1) txt = "Đang tải Cache...";
                    else if (lowerMsg.indexOf("cache unavailable") !== -1) txt = "Không có Cache";
                    else if (lowerMsg.indexOf("cache obsolete") !== -1) txt = "Cache đã cũ";

                    cacheInfo.textContent = txt;
                    if (cls) cacheInfo.className = "value " + cls;
                }
                else {
                    var stTxt = msg;
                    if (lowerMsg.indexOf("loading exploit") !== -1) stTxt = "Đang tải Exploit...";
                    else if (lowerMsg.indexOf("unsupported firmware") !== -1) stTxt = "BẤM PHÍM X ĐỂ TIẾP TỤC BẮT BUỘC";
                    else if (lowerMsg.indexOf("update ready") !== -1) stTxt = "CÓ BẢN CẬP NHẬT - BẤM X ĐỂ TẢI LẠI";
                    else if (lowerMsg.indexOf("cached — tap") !== -1) stTxt = "BẤM PHÍM X ĐỂ TIẾP TỤC CHẠY JAILBREAK";
                    else if (lowerMsg.indexOf("cache failed") !== -1) stTxt = "LỖI CACHE - BẤM X ĐỂ THỬ LẠI";

                    statusInfo.textContent = stTxt;
                    if (cls) statusInfo.className = "value " + cls;
                }
            }

            var params = new URLSearchParams(location.search);

            // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
            var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

            var key = null, fwnum = null;
            var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
            if (m) {
                var ms = parseInt(m[2], 16).toString(16);
                if (ms.length < 2) ms = "0" + ms;
                key = m[1] + "." + ms;
                fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
            }

            var forced = params.get("force") === "1";
            var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

            print("firmware: " + (key || "unknown"));
            print("supported: " + (supported ? "yes" : "no"), supported ? "ok" : "bad");

            var target = "jb.html" + location.search;

            function go() {
                print("loading exploit...", "warn");
                location.replace(target);
            }

            function waitForTap(msg, action) {
                if (msg) print(msg, "warn");
                function fire() {
                    window.removeEventListener("click", fire);
                    window.removeEventListener("keydown", fire);
                    action();
                }
                window.addEventListener("click", fire);
                window.addEventListener("keydown", fire);
            }

            if (!supported) {
                print("UNSUPPORTED FIRMWARE — tap / press X to run anyway", "bad");
                waitForTap("", go);
                return;
            }

            var ac = window.applicationCache;
            if (!ac || !document.documentElement.hasAttribute("manifest")) {
                go();
            } else if (!navigator.onLine) {
                print("offline — running from cache", "ok");
                go();
            } else if (ac.status === ac.IDLE) {
                print("cached", "ok");
                go();
            } else if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) { }
                print("update downloaded", "ok");
                waitForTap("UPDATE READY — tap / press X to reload", function () { location.reload(); });
            } else {
                print("checking cache...");
                ac.addEventListener("downloading",
                    function () { print("caching for offline (first run)..."); }, false);
                ac.addEventListener("progress", function (e) {
                    if (e && e.total)
                        print("caching " + Math.round((e.loaded / e.total) * 100) + "%");
                }, false);
                ac.addEventListener("cached", function () {
                    print("cached for offline use", "ok");
                    waitForTap("CACHED — tap / press X to run", go);
                }, false);
                ac.addEventListener("updateready", function () {
                    try { ac.swapCache(); } catch (e) { }
                    print("update downloaded", "ok");
                    waitForTap("UPDATE READY — tap / press X to reload",
                        function () { location.reload(); });
                }, false);
                ac.addEventListener("noupdate", function () {
                    print("cached — offline ready", "ok");
                    go();
                }, false);
                ac.addEventListener("error", function () {
                    print("cache unavailable");
                    waitForTap("CACHE FAILED — tap / press X to run anyway", go);
                }, false);
                ac.addEventListener("obsolete", function () {
                    print("cache obsolete");
                    waitForTap("CACHE OBSOLETE — tap / press X to run", go);
                }, false);
            }
        })();
    </script>

</html>
